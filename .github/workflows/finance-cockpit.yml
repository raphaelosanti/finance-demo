name: Finance Cockpit

on:
  workflow_dispatch:
    inputs:
      modus:
        description: "Was soll laufen?"
        type: choice
        default: demo-rechnungen
        options:
          - demo-rechnungen
          - demo-zahlungsliste
          - check-sevdesk
          - check-belege
          - check-lexware
          - rechnungen
          - zahlungsliste
      dry_run:
        description: "Nur rechnen und im Log zeigen (nichts schreiben, nichts mailen)"
        type: boolean
        default: true
  schedule:
    - cron: "0 6 1 * *"     # 1. des Monats: Rechnungs-Cockpit
    - cron: "0 6 3 * *"     # 3. des Monats: Zahlungsliste
    - cron: "0 6 15 * *"    # 15. des Monats: Rechnungs-Cockpit
    # 06:00 UTC = 07:00 (Winterzeit) bzw. 08:00 (Sommerzeit) in Berlin

concurrency:
  group: finance-cockpit
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Cockpit ausführen
        env:
          PYTHONUNBUFFERED: "1"
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MODUS: ${{ inputs.modus }}
          DRY_RUN: ${{ inputs.dry_run }}
          GOOGLE_CREDENTIALS_B64: ${{ secrets.GOOGLE_CREDENTIALS_B64 }}
          FINANCE_SHEET_KEY: ${{ secrets.FINANCE_SHEET_KEY }}
          SEVDESK_API_TOKEN: ${{ secrets.SEVDESK_API_TOKEN }}
          LEXWARE_API_KEY: ${{ secrets.LEXWARE_API_KEY }}          # optional
          SEVDESK_CREDIT_DEBIT: ${{ secrets.SEVDESK_CREDIT_DEBIT }} # optional (C oder D)
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          FINANCE_EMAIL: ${{ secrets.FINANCE_EMAIL }}               # optional, überschreibt ALERT_EMAIL
          BOISON_EMAIL: ${{ secrets.BOISON_EMAIL }}                 # optional: Zahlungsliste an Frau Boison
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}           # optional
        run: |
          ARGS=""
          if [ "$EVENT_NAME" = "schedule" ]; then
            if [ "$SCHEDULE" = "0 6 3 * *" ]; then ARGS="--zahlungsliste"; fi
          else
            case "$MODUS" in
              demo-rechnungen)     ARGS="--demo" ;;
              demo-zahlungsliste)  ARGS="--demo --zahlungsliste" ;;
              check-sevdesk)       ARGS="--check" ;;
              check-belege)        ARGS="--check-belege" ;;
              check-lexware)       ARGS="--check-lexware" ;;
              zahlungsliste)       ARGS="--zahlungsliste" ;;
              rechnungen)          ARGS="" ;;
            esac
            if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          fi
          echo "Starte: python finance_cockpit.py $ARGS"
          python finance_cockpit.py $ARGS
